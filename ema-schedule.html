<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年EMA龍聖戦 試合日程</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700;800&family=Noto+Serif+JP:wght@400;600;900&family=Yuji+Mai&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Shippori Mincho B1', serif;
    background: #0a0a0a;
    padding: 20px 12px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .poster {
    width: 100%;
    max-width: 760px;
    background: radial-gradient(ellipse at top, #fef9ed 0%, #f5e8c8 100%);
    position: relative;
    padding: 32px 24px 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .poster::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(139,90,43,0.02) 2px, rgba(139,90,43,0.02) 4px),
      repeating-linear-gradient(-45deg, transparent 0, transparent 2px, rgba(139,90,43,0.02) 2px, rgba(139,90,43,0.02) 4px);
  }
  .poster::after {
    content: ''; position: absolute; inset: 10px; pointer-events: none;
    border: 2px solid #8b2818;
  }
  .corner { position: absolute; width: 22px; height: 22px; border: 3px solid #8b2818; z-index: 2; }
  .corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  /* ヘッダー */
  .header {
    text-align: center; position: relative;
    padding-bottom: 14px; margin-bottom: 16px;
    border-bottom: 1px solid #8b2818;
  }
  .stamp {
    position: absolute; top: -14px; right: -6px;
    width: 52px; height: 52px;
    background: #8b2818; color: #fef9ed;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Yuji Mai', serif; font-size: 16px; line-height: 1.1;
    transform: rotate(-6deg);
    box-shadow: 2px 3px 0 rgba(0,0,0,0.15);
    letter-spacing: 2px; z-index: 3;
  }
  .title {
    font-family: 'Noto Serif JP', serif; font-weight: 900;
    font-size: clamp(18px, 5.4vw, 30px); color: #1a1a1a;
    letter-spacing: clamp(1px, 0.7vw, 5px); line-height: 1.2;
    padding: 0 44px; white-space: nowrap;
  }
  .title .accent { color: #8b2818; }
  .subtitle {
    font-size: 10px; color: #5a4a3a; letter-spacing: 2px;
    margin-top: 5px; white-space: nowrap;
  }

  /* 年月切替 */
  .month-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-top: 12px;
  }
  .month {
    display: flex; align-items: baseline; justify-content: center; gap: 3px;
    min-width: 100px; padding: 6px 18px 9px; line-height: 1;
    background: #1a1a1a; color: #fef9ed; border-radius: 3px;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.18);
    font-family: 'Noto Serif JP', serif;
  }
  .m-year { font-size: 13px; letter-spacing: 1px; opacity: 0.85; margin-right: 8px; font-weight: 600; }
  .m-num { font-size: 38px; font-weight: 900; color: #ffe08a; }
  .m-unit { font-size: 16px; font-weight: 700; }
  .month-btn {
    min-width: 66px; height: 34px; padding: 0 12px; border-radius: 17px;
    background: #8b2818; color: #fef9ed; border: none; cursor: pointer;
    font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 12px; white-space: nowrap;
    box-shadow: 1px 2px 0 rgba(0,0,0,0.15);
  }
  .month-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .month-select {
    display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px;
  }
  .month-select select {
    padding: 6px 10px;
    background: rgba(255,255,255,0.7);
    border: 1px solid #8b2818; border-radius: 3px;
    font-family: 'Noto Serif JP', serif; font-size: 13px; color: #1a1a1a;
  }
  .select-hint { font-size: 10px; color: #5a4a3a; white-space: nowrap; }

  /* タブ */
  .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; position: relative; z-index: 1; }
  .tab {
    padding: 8px 22px;
    background: rgba(255,255,255,0.4);
    border: 1px solid #8b2818; color: #8b2818;
    font-family: 'Noto Serif JP', serif; font-weight: 600;
    font-size: 13px; letter-spacing: 2px; cursor: pointer; border-radius: 2px;
  }
  .tab.active { background: #8b2818; color: #fef9ed; box-shadow: 1px 2px 0 rgba(0,0,0,0.15); }

  /* 検索 */
  .search-box { position: relative; margin-bottom: 12px; z-index: 1; }
  .search-input {
    width: 100%; padding: 8px 36px 8px 32px;
    background: rgba(255,255,255,0.6);
    border: 1px solid #8b2818; border-radius: 4px;
    font-family: 'Shippori Mincho B1', serif; font-size: 14px; color: #1a1a1a; outline: none;
  }
  .search-input:focus { background: rgba(255,255,255,0.9); box-shadow: 0 0 0 2px rgba(139,40,24,0.2); }
  .search-icon { position: absolute; left: 10px; top: 19px; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
  .search-clear {
    position: absolute; right: 6px; top: 19px; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: #8b2818; color: #fef9ed; border: none;
    font-size: 12px; cursor: pointer; display: none; line-height: 1;
  }
  .search-clear.visible { display: block; }
  .search-result {
    margin-top: 6px; padding: 6px 10px;
    background: rgba(139,40,24,0.08); border-left: 2px solid #8b2818;
    font-size: 12px; color: #3a2818; line-height: 1.7; display: none;
  }
  .search-result.visible { display: block; }
  .search-result strong { color: #8b2818; }
  .year-total { font-size: 11px; color: #8b6914; white-space: nowrap; }

  /* リーグフィルター */
  .league-filter { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; position: relative; z-index: 1; }
  .filter-btn {
    padding: 5px 16px;
    background: rgba(255,255,255,0.4);
    border: 1px solid #5a4a3a; color: #5a4a3a;
    font-family: 'Noto Serif JP', serif; font-weight: 600;
    font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 2px;
  }
  .filter-btn.active { background: #1a1a1a; color: #fef9ed; border-color: #1a1a1a; }
  .filter-btn[data-league="a1"].active { background: #8b2818; border-color: #8b2818; }
  .filter-btn[data-league="a2"].active { background: #1a3a5c; border-color: #1a3a5c; }
  body.filter-a1 .is-a2, body.filter-a2 .is-a1 { display: none !important; }
  body.filter-a1 .only-a2, body.filter-a2 .only-a1 { opacity: 0.25; }

  .view { display: none; position: relative; z-index: 1; }
  .view.active { display: block; }

  .empty-month {
    padding: 40px 16px; text-align: center;
    background: rgba(255,255,255,0.45);
    border: 1px dashed rgba(139,40,24,0.4);
    font-family: 'Noto Serif JP', serif; font-size: 13px;
    color: #5a4a3a; letter-spacing: 2px; line-height: 1.8;
  }

  /* ===== カレンダー（土日のみ） ===== */
  .weekdays, .days { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .weekdays { margin-bottom: 6px; }
  .weekday {
    text-align: center; padding: 7px 0;
    font-family: 'Noto Serif JP', serif; font-weight: 700;
    font-size: 13px; letter-spacing: 3px;
    background: rgba(139,40,24,0.08); border-radius: 2px;
  }
  .weekday.sat { color: #1e5b8b; }
  .weekday.sun { color: #8b2818; }
  .day {
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(139,40,24,0.2); border-radius: 3px;
    padding: 10px 8px; min-height: 90px;
    display: flex; flex-direction: column; min-width: 0;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  }
  .day.blank { background: transparent; border: 1px dashed rgba(139,40,24,0.12); }
  .day.none { opacity: 0.45; }
  .day.has-match { background: rgba(255,250,240,0.85); border-color: #8b2818; }
  .day.rest { background: rgba(0,0,0,0.04); opacity: 0.55; }
  .day.study { background: rgba(201,162,39,0.12); border-color: #c9a227; }
  .day.clickable { cursor: pointer; }
  .day.clickable:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(139,40,24,0.3); }
  .day-num {
    font-family: 'Noto Serif JP', serif; font-weight: 800;
    font-size: 22px; color: #1a1a1a; line-height: 1;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px dashed rgba(139,40,24,0.3);
  }
  .day-num.sat { color: #1e5b8b; }
  .day-num.sun { color: #8b2818; }
  .leagues { display: flex; flex-direction: column; gap: 6px; }
  .league-row { display: flex; flex-direction: column; gap: 3px; }
  .league-row-header { display: flex; align-items: center; gap: 6px; }
  .league-badge {
    width: 28px; text-align: center; color: #fef9ed;
    font-family: 'Noto Serif JP', serif; font-weight: 700;
    font-size: 11px; padding: 2px 0; border-radius: 2px;
  }
  .league-badge.a1 { background: #8b2818; }
  .league-badge.a2 { background: #1a3a5c; }
  .league-time { color: #5a4a3a; font-size: 11px; }
  .league-players { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 3px; align-items: stretch; }
  .rest-label, .study-label {
    text-align: center; margin-top: 10px;
    font-family: 'Noto Serif JP', serif; font-size: 14px; letter-spacing: 3px; color: #5a4a3a;
  }
  .study-label { color: #8b6914; font-weight: 700; }
  .study-label .time-line { display: block; font-size: 11px; color: #5a4a3a; font-weight: 400; margin-top: 4px; letter-spacing: 1px; }

  /* 木札カード（共通） */
  .cal-player, .player {
    background:
      repeating-linear-gradient(90deg,
        rgba(101,67,33,0.08) 0px, rgba(101,67,33,0.08) 1px, transparent 1px, transparent 3px,
        rgba(139,90,43,0.05) 3px, rgba(139,90,43,0.05) 4px, transparent 4px, transparent 7px),
      radial-gradient(ellipse 60% 20% at 30% 70%, rgba(101,67,33,0.15), transparent),
      radial-gradient(ellipse 40% 15% at 70% 30%, rgba(101,67,33,0.12), transparent),
      linear-gradient(180deg, #d4a574 0%, #c19058 40%, #a87648 100%);
    border: 1px solid #6b4423; border-radius: 2px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,220,180,0.4), inset 0 -2px 3px rgba(60,30,10,0.3);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    min-width: 0; overflow: hidden; position: relative; text-align: center;
  }
  .cal-player { padding: 5px 1px 5px; }
  .player { padding: 10px 2px 8px; }
  .cal-player::before, .player::before {
    content: ''; position: absolute; inset: 2px; pointer-events: none;
    border: 1px solid rgba(60,30,10,0.35); border-radius: 1px;
  }
  .cal-seat, .seat {
    font-family: 'Yuji Mai', serif; color: #fef9ed; line-height: 1;
    border-radius: 50%; background: #8b2818;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.2);
    position: relative; z-index: 1; flex-shrink: 0;
  }
  .cal-seat { width: 16px; height: 16px; font-size: 9px; margin-bottom: 4px; }
  .seat { width: 24px; height: 24px; font-size: 13px; margin-bottom: 8px; }
  .seat-e { background: #8b2818; }
  .seat-s { background: #2d6b3f; }
  .seat-w { background: #c9a227; }
  .seat-n { background: #1a3a5c; }
  .cal-name, .player-name {
    font-family: 'Shippori Mincho B1', serif; font-weight: 700; color: #2a1810;
    writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl;
    text-orientation: upright; -webkit-text-orientation: upright;
    position: relative; z-index: 1;
    text-shadow: 0 1px 0 rgba(255,220,180,0.5);
  }
  .cal-name { font-size: 10px; line-height: 1.2; letter-spacing: 0.5px; }
  .player-name { font-size: 15px; line-height: 1.3; letter-spacing: 2px; padding: 1px 0; }

  .weekday-head {
    margin: 12px 0 6px; padding: 6px 0; text-align: center;
    font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 13px;
    letter-spacing: 3px; color: #5a4a3a; background: rgba(139,40,24,0.08); border-radius: 2px;
  }
  .wd-label { font-size: 12px; margin-left: 3px; color: #5a4a3a; }
  .cal-player:not(:has(.cal-seat)) { padding-top: 6px; }
  .player:not(:has(.seat)) { padding-top: 10px; }
  .seat-r { background: #6b5b7b; }
  .cal-name, .player-name, .card-count, .card-note { flex-shrink: 0; }
  .cal-name, .player-name { padding-bottom: 6px; }
  .player .card-count, .player .card-note { font-size: 11px; }
  .card-count, .card-note {
    position: relative; z-index: 1; margin-top: auto;
    font-size: 9px; line-height: 1; white-space: nowrap;
  }
  .card-count { color: #2a1810; font-weight: 700; padding-top: 3px; }
  .card-count + .card-note { margin-top: 3px; }
  .card-note { padding: 2px 3px; border-radius: 2px; font-weight: 700; color: #2a1810; }
  .card-note.first { background: #f4c7c7; }
  .card-note.second { background: #b7d9a8; }
  .legend-dot.first { background: #f4c7c7; }
  .legend-dot.second { background: #b7d9a8; }
  .legend-dot.rote { background: #6b5b7b; border-radius: 50%; }
  .staff {
    display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px;
    font-size: 10px; color: #3a2818; line-height: 1.4;
  }
  .staff b {
    display: inline-block; margin-right: 4px; padding: 0 4px;
    background: #5a4a3a; color: #fef9ed; font-weight: 600; font-size: 9px; border-radius: 2px;
  }
  .match-info .staff { font-size: 11px; justify-content: center; }
  .legend-num { font-weight: 700; color: #2a1810; font-size: 11px; }
  /* 札タッチで揺れる */
  #slides .player, #modal-body .player { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .player.swing {
    transform-origin: 50% -6px;
    z-index: 5;
    animation: fuda-swing 1.1s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes fuda-swing {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(9deg); }
    32%  { transform: rotate(-7deg); }
    48%  { transform: rotate(5deg); }
    63%  { transform: rotate(-3deg); }
    78%  { transform: rotate(1.5deg); }
    90%  { transform: rotate(-0.5deg); }
    100% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .player.swing { animation: none; } }
  /* ===== 日別モード：スクロールなしで1画面に収める ===== */
  .fit { transform-origin: top center; }
  body.mode-swipe { padding: 0; height: 100vh; height: 100dvh; overflow: hidden; align-items: stretch; }
  body.mode-swipe .poster {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding: 16px 16px 10px; box-shadow: none;
  }
  body.mode-swipe .poster::after { inset: 6px; }
  body.mode-swipe .corner { width: 16px; height: 16px; border-width: 2px; }
  body.mode-swipe .corner.tl, body.mode-swipe .corner.tr { top: 9px; }
  body.mode-swipe .corner.bl, body.mode-swipe .corner.br { bottom: 9px; }
  body.mode-swipe .corner.tl, body.mode-swipe .corner.bl { left: 9px; }
  body.mode-swipe .corner.tr, body.mode-swipe .corner.br { right: 9px; }
  body.mode-swipe .header { padding-bottom: 6px; margin-bottom: 8px; flex-shrink: 0; }
  body.mode-swipe .title { font-size: 17px; letter-spacing: 2px; padding: 0 40px; }
  body.mode-swipe .subtitle, body.mode-swipe .month-select { display: none; }
  body.mode-swipe .stamp { width: 34px; height: 34px; font-size: 10px; top: 0; right: 2px; }
  body.mode-swipe .month-nav { margin-top: 5px; gap: 6px; }
  body.mode-swipe .month { min-width: 0; padding: 3px 12px 4px; }
  body.mode-swipe .m-year { font-size: 10px; margin-right: 5px; }
  body.mode-swipe .m-num { font-size: 20px; }
  body.mode-swipe .m-unit { font-size: 11px; }
  body.mode-swipe .month-btn { min-width: 50px; height: 24px; padding: 0 8px; font-size: 11px; }
  body.mode-swipe .tabs { margin-bottom: 8px; flex-shrink: 0; }
  body.mode-swipe .tab { padding: 5px 18px; font-size: 12px; }
  body.mode-swipe .search-box { margin-bottom: 6px; flex-shrink: 0; }
  body.mode-swipe .search-input { padding: 5px 34px 5px 30px; font-size: 13px; }
  body.mode-swipe .search-icon, body.mode-swipe .search-clear { top: 15px; }
  body.mode-swipe .search-result { font-size: 11px; padding: 4px 8px; margin-top: 4px; max-height: 3.6em; overflow-y: auto; }
  body.mode-swipe .league-filter { margin-bottom: 8px; flex-shrink: 0; }
  body.mode-swipe .filter-btn { padding: 3px 14px; }
  body.mode-swipe #view-swipe.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  body.mode-swipe .schedule { flex: 1; min-height: 0; }
  body.mode-swipe .slides { height: 100%; }
  body.mode-swipe .day-card { height: 100%; overflow: hidden; padding: 10px 12px; }
  body.mode-swipe .nav { margin-top: 6px; flex-shrink: 0; }
  body.mode-swipe .nav-btn { width: 30px; height: 30px; font-size: 15px; }
  body.mode-swipe .dots { margin-top: 4px; flex-shrink: 0; }
  body.mode-swipe #legend { margin-top: 6px; padding: 4px 8px; flex-shrink: 0; }
  body.mode-swipe .legend { gap: 2px 8px; font-size: 9px; }
  body.mode-swipe .legend-dot { width: 9px; height: 9px; }
  body.mode-swipe .legend-num { font-size: 9px; }
  body.mode-swipe .footer { margin-top: 6px; padding-top: 4px; font-size: 8px; line-height: 1.4; flex-shrink: 0; }
  body.mode-swipe .footer strong { font-size: 9px; }
  body.mode-swipe .footer br { display: none; }
  body.mode-swipe .footer strong::after { content: '　'; }
  .cal-event, .slide-event {
    font-size: 10px; color: #8b6914; line-height: 1.4;
    padding: 3px 6px; background: rgba(201,162,39,0.12); border-left: 2px solid #c9a227;
  }
  .cal-event b, .slide-event b { margin-right: 6px; color: #6b4f0a; }
  .slide-event { font-size: 12px; padding: 6px 10px; }
  /* ===== 自分を登録 ===== */
  .me-bar { margin-bottom: 12px; position: relative; z-index: 1; }
  .me-register {
    width: 100%; padding: 8px 10px; cursor: pointer;
    background: rgba(255,255,255,0.5); border: 1px dashed #8b2818; border-radius: 4px;
    font-family: 'Shippori Mincho B1', serif; font-size: 12px; color: #8b2818;
  }
  .me-info {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 4px;
    background: linear-gradient(90deg, #8b2818, #a8321f); color: #fef9ed;
    box-shadow: 0 2px 6px rgba(139,40,24,0.3);
  }
  .me-text { flex: 1; min-width: 0; font-size: 12px; line-height: 1.5; }
  .me-name { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 13px; }
  .me-next { display: block; font-size: 11px; opacity: 0.95; }
  .me-next b { color: #ffe08a; }
  .me-btn {
    flex-shrink: 0; padding: 4px 9px; cursor: pointer;
    background: #fef9ed; color: #8b2818; border: none; border-radius: 3px;
    font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 11px;
  }
  body:not(.mode-swipe) #me-filter { display: none; }
  .me-btn { white-space: nowrap; }
  .me-btn.sub { background: transparent; color: #fef9ed; border: 1px solid rgba(254,249,237,0.6); }
  /* 自分の札 */
  .player.is-me, .cal-player.is-me {
    box-shadow: 0 0 0 2px #e03a1e, 0 0 10px 2px rgba(224,58,30,0.55), 0 2px 3px rgba(0,0,0,0.3);
  }
  .player.is-me::after, .cal-player.is-me::after {
    content: '★'; position: absolute; top: 1px; right: 2px; z-index: 2;
    font-size: 10px; color: #e03a1e; text-shadow: 0 0 2px #fff;
  }
  .day.me-day .day-num::after {
    content: '★出番'; margin-left: 6px; padding: 1px 5px; vertical-align: middle;
    font-size: 10px; font-weight: 700; color: #fef9ed; background: #e03a1e; border-radius: 2px;
  }

<script>
/* ================================================================
   日程データ
   新しい月を追加するときは "YYYY-MM": { ... } のブロックを追加するだけ。
   type: "match"（試合） / "rest"（休場） / "study"（勉強会）
   players は 東・南・西・北 の順（seats: true のとき東南西北を表示）
   time を省略すると時間は表示されません
   出席者は雀記の半荘結果（出力日 2026/9/30）が正。席順・時間・ローテ・実況は各月の日程表から反映
   seatOf: { 選手名: "東"|"南"|"西"|"北"|"替" }（席が分からない選手は省略）
   events: 試合以外の予定（勉強会・企画・中止）
   off: true の月はお休みの月（土日をすべて休場と表示）
   ================================================================ */

/* ================================================================ */
const WD = ['日','月','火','水','木','金','土'];
const WD_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTH_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const SEATS = [['東','seat-e'],['南','seat-s'],['西','seat-w'],['北','seat-n'],['替','seat-r']];
const KD = '〇一二三四五六七八九';
const kanjiYear = y => String(y).split('').map(d => KD[d]).join('');
const kanjiMonth = m => m <= 10 ? (m === 10 ? '十' : KD[m]) : '十' + KD[m - 10];
const ymKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
const dow = (y, m, d) => new Date(y, m - 1, d).getDay();
const wdClass = w => w === 6 ? 'sat' : (w === 0 ? 'sun' : '');
const extras = (mt, p, short) => {
  let s = '';
  if (mt.counts && mt.counts[p]) s += `<div class="card-count">(${mt.counts[p]})</div>`;
  const n = mt.notes && mt.notes[p];
  if (n) s += `<div class="card-note ${n === '前半のみ' ? 'first' : 'second'}">${short ? n[0] : n.replace('のみ', '')}</div>`;
  return s;
};
// 札の列数：人数ぶん1列に並べる（カレンダーは狭いので7人以上は2段に均等割り）
const colsOf = (n, cal) => cal && n > 6 ? Math.ceil(n / 2) : Math.max(n, 4);
const staffLine = mt => {
  if (!mt.staff) return '';
  const c = mt.staff.commentary && mt.staff.commentary.length ? mt.staff.commentary.map(esc).join('・') : 'なし';
  const s = mt.staff.switcher ? esc(mt.staff.switcher) : 'なし';
  return `<div class="staff"><span><b>実況・解説</b>${c}</span><span><b>スイッチャー</b>${s}</span></div>`;
};
const SEAT_CLS = { '東': 'seat-e', '南': 'seat-s', '西': 'seat-w', '北': 'seat-n', '替': 'seat-r' };
const seatOfP = (mt, p, i) => mt.seatOf ? (mt.seatOf[p] || '') : (mt.seats ? (SEATS[i] || SEATS[4])[0] : '');
const seatHTML = (mt, p, i, cls) => { const s = seatOfP(mt, p, i); return s ? `<div class="${cls} ${SEAT_CLS[s]}">${s}</div>` : ''; };
const eventsHTML = (entry, cls) => (entry.events || []).map(ev =>
  `<div class="${cls}"><b>${esc(ev.label)}</b>${ev.time ? esc(ev.time) : ''}</div>`).join('');
// 縦書きの高さ計算用：全角=1、半角英数は少し長め
const nameUnits = p => [...p].reduce((a, c) => a + (c.charCodeAt(0) < 128 ? 1.25 : 1), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const keys = Object.keys(SCHEDULE).sort();
const years = keys.map(k => +k.slice(0, 4));
const MIN_YEAR = Math.min(...years), MAX_YEAR = Math.max(...years) + 1;
let [curY, curM] = keys[keys.length - 1].split('-').map(Number);
let slideIndex = 0;
let myOnly = false;      // 日別表示を「自分の出番の日だけ」に絞るか
let monthDays = [];      // 表示中の月の全日データ（モーダル用）

const $ = id => document.getElementById(id);

/* ---------- 描画 ---------- */
function onlyClass(entry) {
  return entry.type === 'study' && entry.league ? ' only-' + entry.league.toLowerCase() : '';
}

function calCell(y, m, d, entry, label) {
  const w = dow(y, m, d);
  const num = `<div class="day-num ${wdClass(w)}">${label || d}</div>`;
  if (!entry) return `<div class="day none">${num}</div>`;
  if (entry.type === 'rest') return `<div class="day rest clickable" data-date="${d}">${num}<div class="rest-label">休 場</div></div>`;
  if (entry.type === 'study') {
    const short = entry.label.replace(/^A[12]リーグ/, '');
    return `<div class="day study clickable${onlyClass(entry)}" data-date="${d}">${num}<div class="study-label">${esc(short)}<span class="time-line">${esc(entry.time)}</span></div></div>`;
  }
  const rows = entry.matches.map(mt => {
    const lg = mt.league.toLowerCase();
    const cards = mt.players.map((p, i) =>
      `<div class="cal-player">${seatHTML(mt, p, i, 'cal-seat')}<div class="cal-name" data-name="${esc(p)}" style="--n:${nameUnits(p)}">${esc(p)}</div>${extras(mt, p, true)}</div>`).join('');
    const info = mt.time ? esc(mt.time.split('—')[0].trim()) : `${mt.hanchan}半荘`;
    return `<div class="league-row is-${lg}"><div class="league-row-header"><div class="league-badge ${lg}">${mt.league}</div><div class="league-time">${info}</div></div><div class="league-players" style="--cols:${colsOf(mt.players.length, true)}">${cards}</div>${staffLine(mt)}</div>`;
  }).join('');
  const ev = eventsHTML(entry, 'cal-event');
  const cls = rows ? 'has-match' : 'study';
  return `<div class="day ${cls} clickable" data-date="${d}">${num}<div class="leagues">${rows}${ev}</div></div>`;
}

function slideCard(y, m, entry) {
  const d = entry.date, w = dow(y, m, d);
  const block = `<div class="date-block"><div class="date-num">${d}</div><div class="date-day ${wdClass(w)}">${WD_EN[w]} ${WD[w]}</div></div>`;
  if (entry.type === 'rest') return `<div class="day-card rest" data-date="${d}">${block}<div class="rest-text">休 場</div></div>`;
  if (entry.type === 'study') return `<div class="day-card study${onlyClass(entry)}" data-date="${d}">${block}<div class="study-text"><div>${esc(entry.label)}</div><div class="study-time">${esc(entry.time)}</div></div></div>`;
  const matches = entry.matches.map(mt => {
    const lg = mt.league.toLowerCase();
    const cards = mt.players.map((p, i) =>
      `<div class="player">${seatHTML(mt, p, i, 'seat')}<div class="player-name" data-name="${esc(p)}" style="--n:${nameUnits(p)}">${esc(p)}</div>${extras(mt, p)}</div>`).join('');
    const time = mt.time ? `<div class="match-time">${esc(mt.time)}</div>` : '';
    return `<div class="match is-${lg}"><div class="league-tag ${lg}">${mt.league}<span class="small">リーグ</span></div><div class="match-info"><div class="match-header">${time}<span class="hanchan">${mt.hanchan}半荘</span></div><div class="players" style="--cols:${colsOf(mt.players.length)}">${cards}</div>${staffLine(mt)}</div></div>`;
  }).join('');
  return `<div class="day-card" data-date="${d}"><div class="fit">${block}<div class="matches">${matches}${eventsHTML(entry, 'slide-event')}</div></div></div>`;
}

function render() {
  const data = SCHEDULE[ymKey(curY, curM)];
  $('title-year').textContent = curY;
  $('month-label').innerHTML = `<span class="m-num">${curM}</span><span class="m-unit">月</span>`;
  const pm = curM === 1 ? 12 : curM - 1, nm = curM === 12 ? 1 : curM + 1;
  $('m-prev').textContent = `‹ ${pm}月`;
  $('m-next').textContent = `${nm}月 ›`;
  $('subtitle').textContent = `${MONTH_EN[curM - 1]}  TOURNAMENT  SCHEDULE`;
  $('sel-year').value = curY;
  $('sel-month').value = curM;
  $('m-prev').disabled = curY === MIN_YEAR && curM === 1;
  $('m-next').disabled = curY === MAX_YEAR && curM === 12;
  const v = (data && data.venue) || DEFAULT_VENUE;
  $('footer').innerHTML = `<strong>会場 ◆ ${esc(v.name)}</strong><br>${esc(v.address)}`;

  const cal = $('view-calendar');
  const slides = $('slides');
  if (!data || (!data.days.length && !data.off)) {
    const msg = `<div class="empty-month">${curY}年${curM}月の日程は<br>まだ登録されていません</div>`;
    cal.innerHTML = msg;
    slides.innerHTML = `<div class="day-card" style="border:none;background:none;padding:0">${msg}</div>`;
  } else {
    const byDate = {};
    data.days.forEach(e => byDate[e.date] = e);
    const last = new Date(curY, curM, 0).getDate();
    const days = [...data.days];
    for (let d = 1; d <= last; d++) {
      const w = dow(curY, curM, d);
      if ((w === 6 || w === 0) && !byDate[d]) { byDate[d] = { date: d, type: 'rest' }; days.push(byDate[d]); }
    }
    let cells = '';
    let started = false;
    let weekdayCells = '';
    for (let d = 1; d <= last; d++) {
      const w = dow(curY, curM, d);
      if (w !== 6 && w !== 0) {
        if (byDate[d]) weekdayCells += calCell(curY, curM, d, byDate[d], `${d}<span class="wd-label">(${WD[w]})</span>`);
        continue;
      }
      if (!started && w === 0) cells += '<div class="day blank"></div>';
      started = true;
      cells += calCell(curY, curM, d, byDate[d]);
    }
    cal.innerHTML = `<div class="weekdays"><div class="weekday sat">土</div><div class="weekday sun">日</div></div>
      <div class="days">${cells}</div>
      ${weekdayCells ? `<div class="weekday-head">平日開催</div><div class="days">${weekdayCells}</div>` : ''}`;
    days.sort((a, b) => a.date - b.date);
    monthDays = days;
    let list = days;
    if (myOnly && me) {
      const mine = days.filter(e => (e.matches || []).some(mt => mt.players.includes(me)));
      if (mine.length) list = mine;   // この月に出番が無ければ全日を表示
    }
    slides.innerHTML = list.map(e => slideCard(curY, curM, e)).join('');
  }

  // スライド初期化
  slideIndex = 0;
  const total = slides.children.length;
  $('total').textContent = total;
  $('dots').innerHTML = Array.from({ length: total }, (_, i) => `<div class="dot" data-i="${i}"></div>`).join('');
  $('nav').style.display = data ? '' : 'none';
  $('legend').style.display = data ? '' : 'none';
  $('dots').style.display = data ? '' : 'none';
  updateSlide();

  // カレンダーの日付クリック → 全画面
  cal.querySelectorAll('.day.clickable').forEach(el => el.addEventListener('click', () => openModal(el.dataset.date)));

  runSearch();
  applyMe();
  requestAnimationFrame(equalizeAll);
}

/* ---------- 年月セレクト ---------- */
function buildSelects() {
  let yo = '';
  for (let y = MIN_YEAR; y <= MAX_YEAR; y++) yo += `<option value="${y}">${y}年</option>`;
  $('sel-year').innerHTML = yo;
  $('sel-month').innerHTML = Array.from({ length: 12 }, (_, i) => {
    const has = SCHEDULE[ymKey(curY, i + 1)] ? ' ●' : '';
    return `<option value="${i + 1}">${i + 1}月${has}</option>`;
  }).join('');
}
function goMonth(y, m) {
  if (m < 1) { y--; m = 12; }
  if (m > 12) { y++; m = 1; }
  if (y < MIN_YEAR || y > MAX_YEAR) return;
  curY = y; curM = m;
  buildSelects();
  render();
}
$('m-prev').addEventListener('click', () => goMonth(curY, curM - 1));
$('m-next').addEventListener('click', () => goMonth(curY, curM + 1));
$('sel-year').addEventListener('change', e => goMonth(+e.target.value, curM));
$('sel-month').addEventListener('change', e => goMonth(curY, +e.target.value));

/* ---------- タブ ---------- */
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab.dataset.view));
  document.body.classList.toggle('mode-swipe', tab.dataset.view === 'swipe');
  window.scrollTo(0, 0);
  requestAnimationFrame(equalizeAll);
}));

/* ---------- リーグフィルター ---------- */
document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.body.classList.remove('filter-a1', 'filter-a2');
  if (btn.dataset.league !== 'all') document.body.classList.add('filter-' + btn.dataset.league);
}));

/* ---------- スライド ---------- */
function updateSlide() {
  const slides = $('slides');
  const total = slides.children.length;
  slides.style.transform = `translateX(-${slideIndex * 100}%)`;
  let cur = total ? slideIndex + 1 : 0, all = total;
  if (myOnly && me && total) {   // 出場日のみ表示中は、その年の通算の順番で数える
    const d = +slides.children[slideIndex].dataset.date;
    const apps = myAppearances().filter(a => a.y === curY);
    const pos = apps.findIndex(a => a.m === curM && a.d === d);
    if (pos >= 0) { cur = pos + 1; all = apps.length; }
  }
  $('current').textContent = cur;
  $('total').textContent = all;
  $('dots').querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === slideIndex));
  $('prev').disabled = slideIndex === 0 && !adjacentMine(-1);
  $('next').disabled = slideIndex >= total - 1 && !adjacentMine(1);
}
/* 出場日のみ表示中：今見ている日の前/後にある自分の出番（月をまたいでよい） */
function adjacentMine(dir) {
  if (!myOnly || !me) return null;
  const cur = $('slides').children[slideIndex];
  if (!cur || !cur.dataset.date) return null;
  const key = a => a.y * 10000 + a.m * 100 + a.d;
  const ck = curY * 10000 + curM * 100 + (+cur.dataset.date);
  const apps = myAppearances();
  return dir > 0 ? (apps.find(a => key(a) > ck) || null)
                 : ([...apps].reverse().find(a => key(a) < ck) || null);
}
function stepSlide(dir) {
  const total = $('slides').children.length;
  const t = slideIndex + dir;
  if (t >= 0 && t < total) { goSlide(t); return; }
  const a = adjacentMine(dir);     // 月の端まで来たら、隣の月の出番へ自動で移る
  if (!a) return;
  curY = a.y; curM = a.m;
  buildSelects();
  render();
  requestAnimationFrame(() => {
    const idx = [...$('slides').children].findIndex(c => +c.dataset.date === a.d);
    if (idx >= 0) goSlide(idx);
  });
}
function goSlide(i) {
  const total = $('slides').children.length;
  slideIndex = Math.max(0, Math.min(total - 1, i));
  updateSlide();
}
$('prev').addEventListener('click', () => stepSlide(-1));
$('next').addEventListener('click', () => stepSlide(1));
$('dots').addEventListener('click', e => { if (e.target.dataset.i) goSlide(+e.target.dataset.i); });
let sx = 0, cx = 0, drag = false;
$('schedule').addEventListener('touchstart', e => { sx = cx = e.touches[0].clientX; drag = true; });
$('schedule').addEventListener('touchmove', e => { if (drag) cx = e.touches[0].clientX; });
$('schedule').addEventListener('touchend', () => {
  if (drag && Math.abs(cx - sx) > 50) stepSlide(cx < sx ? 1 : -1);
  drag = false;
});
document.addEventListener('keydown', e => {
  if ($('modal').classList.contains('active')) { if (e.key === 'Escape') closeModal(); return; }
  if (!$('view-swipe').classList.contains('active') || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') stepSlide(-1);
  if (e.key === 'ArrowRight') stepSlide(1);
});

/* ---------- 全画面モーダル ---------- */
function openModal(date) {
  let card = $('slides').querySelector(`.day-card[data-date="${date}"]`);
  if (!card) {   // 出番のみ表示中でスライドに無い日は、データから作る
    const e = monthDays.find(x => String(x.date) === String(date));
    if (!e) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = slideCard(curY, curM, e);
    card = tmp.firstElementChild;
  }
  const body = $('modal-body');
  body.innerHTML = '';
  const clone = card.cloneNode(true);
  clone.classList.remove('match-found');
  clone.style.height = '';
  clone.querySelectorAll('.fit').forEach(f => f.style.transform = '');
  body.appendChild(clone);
  $('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => equalize('#modal-body .player'));
}
function closeModal() {
  $('modal').classList.remove('active');
  document.body.style.overflow = '';
}
$('modal-close').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

/* ---------- 選手名検索 ---------- */
function runSearch() {
  const q = $('search-input').value.trim().toLowerCase();
  const names = document.querySelectorAll('.poster [data-name]');
  names.forEach(n => n.classList.remove('highlight'));
  document.querySelectorAll('.match-found').forEach(e => e.classList.remove('match-found'));
  $('search-clear').classList.toggle('visible', !!q);
  const res = $('search-result');
  if (!q) {
    document.body.classList.remove('searching');
    res.classList.remove('visible');
    return;
  }
  document.body.classList.add('searching');

  // 表示中の月のデータから、ヒットした選手ごとの出席日を集計
  const data = SCHEDULE[ymKey(curY, curM)];
  const hits = {};
  if (data) data.days.forEach(e => (e.matches || []).forEach(mt => mt.players.forEach(p => {
    if (p.toLowerCase().includes(q)) (hits[p] = hits[p] || new Set()).add(e.date);
  })));

  const matchedDates = new Set();
  Object.values(hits).forEach(s => s.forEach(d => matchedDates.add(String(d))));
  names.forEach(n => { if (n.dataset.name.toLowerCase().includes(q)) n.classList.add('highlight'); });
  document.querySelectorAll('.poster .day[data-date], .poster .day-card[data-date]').forEach(el => {
    if (matchedDates.has(el.dataset.date)) el.classList.add('match-found');
  });

  // 同じ年の通算出席日
  const yearHits = {};
  Object.keys(SCHEDULE).filter(k => +k.slice(0, 4) === curY).forEach(k => {
    SCHEDULE[k].days.forEach(e => (e.matches || []).forEach(mt => mt.players.forEach(p => {
      if (p.toLowerCase().includes(q)) (yearHits[p] = yearHits[p] || new Set()).add(k + '-' + e.date);
    })));
  });
  const lines = Object.keys(yearHits).sort((a, b) => (hits[b] ? 1 : 0) - (hits[a] ? 1 : 0)).map(p => {
    const total = `<span class="year-total">${curY}年通算 ${yearHits[p].size}日</span>`;
    if (!hits[p]) return `<strong>${esc(p)}</strong>：${curM}月の出席なし　${total}`;
    const dates = [...hits[p]].sort((a, b) => a - b)
      .map(d => `${curM}月${d}日(${WD[dow(curY, curM, d)]})`).join('、');
    return `<strong>${esc(p)}</strong>：出席日${hits[p].size}日（${dates}）　${total}`;
  });
  res.innerHTML = lines.length ? lines.join('<br>') : `<strong>"${esc(q)}"</strong>：該当する選手はいません`;
  res.classList.add('visible');
}
$('search-input').addEventListener('input', runSearch);
$('search-clear').addEventListener('click', () => { $('search-input').value = ''; runSearch(); $('search-input').focus(); });

/* ---------- 木札カードの高さを同じ日の中で一番長い名前に揃える ---------- */
function equalize(selector, root = document) {
  const cards = root.querySelectorAll(selector);
  cards.forEach(c => c.style.height = 'auto');
  let max = 0;
  cards.forEach(c => { max = Math.max(max, c.offsetHeight); });
  if (max > 0) cards.forEach(c => c.style.height = max + 'px');
}
function equalizeAll() {
  document.querySelectorAll('#view-calendar .day').forEach(d => equalize('.cal-player', d));
  document.querySelectorAll('#slides .day-card').forEach(d => equalize('.player', d));
  fitSlides();
}

/* ---------- 日別：スマホ1画面に収まるよう各日のカードを縮小 ---------- */
function fitSlides() {
  const swipe = document.body.classList.contains('mode-swipe');
  document.querySelectorAll('#slides .fit').forEach(f => {
    f.style.transform = '';
    if (!swipe) return;
    const card = f.parentElement;
    const cs = getComputedStyle(card);
    const avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const need = f.scrollHeight;
    if (avail > 0 && need > avail) f.style.transform = `scale(${(avail / need).toFixed(3)})`;
  });
}
window.addEventListener('resize', () => requestAnimationFrame(equalizeAll));
new ResizeObserver(() => { if (document.body.classList.contains('mode-swipe')) fitSlides(); }).observe($('schedule'));
window.addEventListener('load', equalizeAll);
if (document.fonts) document.fonts.ready.then(equalizeAll);

/* ---------- 日別の札をタッチすると揺れる ---------- */
function swingCard(e) {
  const card = e.target.closest('.player');
  if (!card) return;
  card.classList.remove('swing');
  void card.offsetWidth;            // 連続タップでも最初から揺れ直す
  card.classList.add('swing');
}
$('slides').addEventListener('click', swingCard);
$('modal-body').addEventListener('click', swingCard);
document.addEventListener('animationend', e => {
  if (e.animationName === 'fuda-swing') e.target.classList.remove('swing');
});

/* ---------- 自分を登録（このスマホのブラウザにだけ保存） ---------- */
const ME_KEY = 'ema-ryuseisen-me';
let me = '';
try { me = localStorage.getItem(ME_KEY) || ''; } catch (e) {}
function saveMe(name) {
  me = name;
  if (!name) myOnly = false;
  try { name ? localStorage.setItem(ME_KEY, name) : localStorage.removeItem(ME_KEY); } catch (e) {}
  closeMePicker();
  render();   // 名前を変えたら日別の絞り込みも作り直す
}
function allPlayers() {
  const lg = {};
  Object.values(SCHEDULE).forEach(mo => mo.days.forEach(e => (e.matches || []).forEach(mt =>
    mt.players.forEach(p => { lg[p] = lg[p] || mt.league; }))));
  return lg;
}
function myAppearances() {
  const out = [];
  if (!me) return out;
  Object.keys(SCHEDULE).sort().forEach(k => {
    const [y, m] = k.split('-').map(Number);
    [...SCHEDULE[k].days].sort((a, b) => a.date - b.date).forEach(e => (e.matches || []).forEach(mt => {
      const i = mt.players.indexOf(me);
      if (i >= 0) out.push({ y, m, d: e.date, mt, seat: seatOfP(mt, me, i) });
    }));
  });
  return out;
}
function describe(a) {
  const w = WD[dow(a.y, a.m, a.d)];
  const t = a.mt.time ? a.mt.time.split('—')[0].replace('〜', '').trim() + '〜' : '';
  const seat = a.seat ? (a.seat === '替' ? '・ローテ' : `・${a.seat}家`) : '';
  return `${a.m}/${a.d}(${w}) ${a.mt.league} ${t}${seat}`;
}
let meTarget = null;
function applyMe() {
  document.querySelectorAll('.is-me').forEach(e => e.classList.remove('is-me'));
  document.querySelectorAll('.me-day').forEach(e => e.classList.remove('me-day'));
  const bar = $('me-bar');
  if (!me) {
    bar.innerHTML = '<button class="me-register" id="me-open">👤 自分の名前を登録すると、出番がすぐ分かります</button>';
    $('me-open').onclick = openMePicker;
    requestAnimationFrame(fitSlides);
    return;
  }
  document.querySelectorAll('.poster [data-name]').forEach(n => {
    if (n.dataset.name !== me) return;
    n.parentElement.classList.add('is-me');
    const day = n.closest('.day');
    if (day) day.classList.add('me-day');
  });
  const apps = myAppearances();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const inMonth = apps.filter(a => a.y === curY && a.m === curM);
  const next = apps.find(a => new Date(a.y, a.m - 1, a.d) >= today);
  const monthCount = inMonth.length;
  // 表示中の月に出番があれば、その月の中で案内する（月が勝手に切り替わらないように）
  const nextInMonth = inMonth.find(a => new Date(a.y, a.m - 1, a.d) >= today);
  // 「次の出番」は表示中の月に関係なく、常に今日以降で一番近い出番
  let line;
  if (next) line = `次の出番 <b>${describe(next)}</b>`;
  else if (apps.length) line = `予定されている出番はありません（前回 ${describe(apps[apps.length - 1])}）`;
  else line = '登録されている出番はありません';
  // 「見る」の移動先は、表示中の月に出番があればその月の中（月が勝手に切り替わらないように）
  if (inMonth.length) meTarget = nextInMonth || inMonth[0];
  else meTarget = next || (apps.length ? apps[apps.length - 1] : null);

  bar.innerHTML = `<div class="me-info">
      <div class="me-text"><span class="me-name">★ ${esc(me)}</span>　${curM}月の出番 ${monthCount}日<span class="me-next">${line}</span></div>
      ${meTarget ? '<button class="me-btn" id="me-go">見る</button>' : ''}
      <button class="me-btn sub" id="me-filter">${myOnly ? '全日表示' : '出番のみ'}</button>
      <button class="me-btn sub" id="me-open">変更</button>
    </div>`;
  $('me-filter').onclick = () => { myOnly = !myOnly; render(); };
  $('me-open').onclick = openMePicker;
  if (meTarget) $('me-go').onclick = () => showMyDay(meTarget);
  requestAnimationFrame(fitSlides);
}
function showMyDay(a) {
  myOnly = true;                       // 見る → 日別は出番の日だけに絞る
  curY = a.y; curM = a.m;
  buildSelects();
  render();
  const swipeTab = document.querySelector('.tab[data-view="swipe"]');
  if (!swipeTab.classList.contains('active')) swipeTab.click();
  requestAnimationFrame(() => {
    const idx = [...$('slides').children].findIndex(c => +c.dataset.date === a.d);
    if (idx >= 0) goSlide(idx);
  });
}
function openMePicker() {
  const lg = allPlayers();
  const group = L => Object.keys(lg).filter(p => lg[p] === L).sort((a, b) => a.localeCompare(b, 'ja'))
    .map(p => `<button class="me-name-btn${p === me ? ' current' : ''}" data-name-pick="${esc(p)}">${esc(p)}</button>`).join('');
  $('me-list').innerHTML = ['A1', 'A2'].map(L =>
    `<div class="me-group"><div class="me-group-title ${L.toLowerCase()}">${L}リーグ</div><div class="me-names">${group(L)}</div></div>`).join('');
  $('me-clear').style.display = me ? '' : 'none';
  $('me-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeMePicker() {
  $('me-modal').classList.remove('active');
  document.body.style.overflow = '';
}
$('me-list').addEventListener('click', e => { const b = e.target.closest('[data-name-pick]'); if (b) saveMe(b.dataset.namePick); });
$('me-clear').addEventListener('click', () => saveMe(''));
$('me-close').addEventListener('click', closeMePicker);
$('me-modal').addEventListener('click', e => { if (e.target === $('me-modal')) closeMePicker(); });

buildSelects();
render();
</script>
</body>
